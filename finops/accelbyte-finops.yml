description: >-
  FinOps view of AccelByte Gaming Services (AGS) spend. AGS is a B2B platform
  billed primarily on Monthly Active Users (MAU) across the online services
  suite, plus pass-through dedicated server compute (Armada) for session-based
  games and storage/egress for Cloud Save and UGC. Because pricing is
  quote-based, cost management centers on tracking MAU, server-hours, and
  storage rather than public per-request rates.
notes: >-
  AccelByte does not publish public unit rates; verify commercial structure
  (MAU tiers, DS compute pass-through, storage/egress) with AccelByte during
  reconciliation.
sources:
- https://accelbyte.io/pricing
- https://accelbyte.io/products
- https://focus.finops.org/focus-specification/v1-3/

publisherName: AccelByte
serviceCategory: Developer Tools and Platform
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: AccelByte Gaming Services

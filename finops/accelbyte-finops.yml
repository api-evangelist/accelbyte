meters:
- name: monthly_active_users
  description: Distinct active players in the billing period; primary AGS billing metric.
  unit: users
  aggregation: max
  dimensions:
  - environment
  - namespace
- name: dedicated_server_hours
  description: Armada/DSMC dedicated server compute hours for session-based games.
  unit: hours
  aggregation: sum
  dimensions:
  - environment
  - region
- name: cloudsave_storage
  description: Stored player and game record data (Cloud Save).
  unit: gigabytes
  aggregation: max
  dimensions:
  - environment
  - namespace
- name: ugc_storage
  description: Stored and served user-generated content payloads.
  unit: gigabytes
  aggregation: max
  dimensions:
  - environment
  - namespace
- name: telemetry_events
  description: Telemetry events ingested through Game Telemetry.
  unit: events
  aggregation: sum
  dimensions:
  - environment
  - namespace
- name: data_egress
  description: Network egress for content delivery and server traffic.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - environment
  - region
principles:
- name: Visibility
  description: Track MAU, dedicated server-hours, and storage per environment/namespace against the AGS agreement.
- name: Allocation
  description: Map namespaces and environments to titles/teams so platform spend is attributed to the right game.
- name: Optimization
  description: Right-size dedicated server fleets per region, batch telemetry, and prune stale Cloud Save/UGC data to control compute, egress, and storage.
- name: Accountability
  description: Assign per-title owners; review MAU-driven cost and server utilization monthly against forecast.

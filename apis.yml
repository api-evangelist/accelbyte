aid: accelbyte
url: https://raw.githubusercontent.com/api-evangelist/accelbyte/refs/heads/main/apis.yml
name: AccelByte
kind: company
description: AccelByte provides AccelByte Gaming Services (AGS), a modular backend
  platform for live games. Its REST services cover player accounts and IAM, player
  profiles, cloud save, statistics and leaderboards, matchmaking, lobby and session,
  commerce and monetization, seasons and battle pass, achievements, dedicated server
  management (Armada/DSMC), analytics and telemetry, and user-generated content, all
  secured with OAuth2 client credentials and namespace-scoped IAM.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
